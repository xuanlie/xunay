<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>CirclePacking</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--border:#e2e8f0;--muted:#64748b}
[data-theme=dark]{--bg:#0a0e17;--card:#0f172a;--text:#e2e8f0;--border:#1e293b;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui;padding:24px;transition:background .2s,color .2s}
h1{font-size:20px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
button{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px;transition:all .15s}
button:hover{border-color:#3b82f6;color:#60a5fa;transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.card-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
#log{position:fixed;bottom:16px;right:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font:12px ui-monospace,monospace;color:var(--muted);max-width:340px;max-height:180px;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
#log.show{display:block}
</style></head><body>
<h1>CirclePacking · 圆堆积图</h1>
<div class="toolbar">
<button id="btn-theme">🌓 主题</button>
<button id="btn-depth">📏 层级</button>
<button id="btn-rand">🎲 随机</button>
<button id="btn-replay">▶ 重播</button>
<button id="btn-log">📋 日志</button>
</div>
<div class="grid">
<div class="card"><div class="card-label">全球语言分布</div><div id="c1"></div></div>
<div class="card"><div class="card-label">公司组织架构</div><div id="c2"></div></div>
</div>
<div id="log"></div>
<script type="module">
import CirclePackingChart from './kit/charts/circlepack.js'
const logEl = document.getElementById('log')
function log(...a){logEl.classList.add('show');logEl.textContent=`[${new Date().toLocaleTimeString()}] ${a.join(' ')}\n`+logEl.textContent;if(logEl.textContent.length>3000)logEl.textContent=logEl.textContent.slice(0,3000)}
document.getElementById('btn-log').onclick=()=>logEl.classList.toggle('show')
const langData = {
  children: [
    { label: '中文', value: 1200, children: [
      { label: '普通话', value: 900 },
      { label: '粤语', value: 200 },
      { label: '闽南语', value: 100 },
    ]},
    { label: '英语', value: 1000, children: [
      { label: '美式', value: 500 },
      { label: '英式', value: 300 },
      { label: '其他', value: 200 },
    ]},
    { label: '西班牙语', value: 550, children: [
      { label: '拉美', value: 400 },
      { label: '西班牙', value: 150 },
    ]},
    { label: '印地语', value: 600 },
    { label: '阿拉伯语', value: 400 },
    { label: '法语', value: 300 },
    { label: '葡萄牙语', value: 260 },
    { label: '俄语', value: 250 },
    { label: '日语', value: 130 },
    { label: '德语', value: 130 },
  ]
}
const orgData = {
  children: [
    { label: '技术部', value: 500, children: [
      { label: '前端', value: 150, children: [
        { label: 'React', value: 80 },
        { label: 'Vue', value: 70 },
      ]},
      { label: '后端', value: 200 },
      { label: '算法', value: 100 },
      { label: '测试', value: 50 },
    ]},
    { label: '产品部', value: 200, children: [
      { label: '设计', value: 100 },
      { label: '产品', value: 100 },
    ]},
    { label: '运营部', value: 250, children: [
      { label: '市场', value: 120 },
      { label: '内容', value: 80 },
      { label: '客服', value: 50 },
    ]},
    { label: '销售部', value: 300, children: [
      { label: '华北', value: 100 },
      { label: '华东', value: 130 },
      { label: '华南', value: 70 },
    ]},
    { label: '行政部', value: 80 },
    { label: '财务部', value: 60 },
  ]
}
const c1 = new CirclePackingChart('#c1',{
  title:'全球语言使用人数',
  subtitle:'面积表示相对数量',
  data: langData,
  height:520,
  maxDepth: 2,
  onHover: n => n && log('hover', n.label, n.value),
  onCircleClick: (n, l) => log('click', n.label, 'depth='+l),
})
const c2 = new CirclePackingChart('#c2',{
  title:'公司组织架构',
  data: orgData,
  height:520,
  maxDepth: 3,
  colors: ['#6366f1','#8b5cf6','#ec4899','#f97316','#10b981','#06b6d4'],
})
let dark=false
document.getElementById('btn-theme').onclick=()=>{dark=!dark;document.documentElement.setAttribute('data-theme',dark?'dark':'');const t=dark?'dark':'light';[c1,c2].forEach(c=>c.setOptions({theme:t}));log('主题 →',t)}
let depths=[2,1,3], di=0
document.getElementById('btn-depth').onclick=()=>{di=(di+1)%depths.length;const d=depths[di];c1.setOptions({maxDepth:d});log('层级 →',d)}
document.getElementById('btn-rand').onclick=()=>{c1.setData(langData);c2.setData(orgData);log('已刷新')}
document.getElementById('btn-replay').onclick=()=>{[c1,c2].forEach(c=>c.replay());log('重播')}
window.addEventListener('error',e=>log('ERR',e.message))
</script></body></html>
