<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JS 基础测试</title></head>
<body style="padding:40px">
<div id="root" style="border:3px solid red;padding:20px;min-height:80px">
  <div style="color:red">初始占位（如果这行还在，说明 JS 没跑）</div>
</div>
<script type="module">
  const root = document.getElementById('root')
  root.innerHTML = ''

  const el = document.createElement('div')
  el.style.cssText = 'padding:20px;background:yellow;border:3px solid blue;font-size:18px;border-radius:10px'
  el.textContent = '✓ JS 跑起来了，DOM 创建正常'
  root.appendChild(el)

  document.title = 'OK'
</script>
</body></html>
