<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GaugeChart 精修版</title>
<style>
  :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --border:#e2e8f0; --muted:#64748b; }
  [data-theme="dark"] { --bg:#0a0e17; --card:#0f172a; --text:#e2e8f0; --border:#1e293b; --muted:#94a3b8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 system-ui; padding:24px; transition:background .2s,color .2s; }
  h1 { font-size:20px; margin-bottom:16px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  button { padding:6px 14px; border:1px solid var(--border); border-radius:8px;
    background:var(--card); color:var(--text); cursor:pointer; font-size:13px; transition:all .15s; }
  button:hover { border-color:#3b82f6; color:#60a5fa; transform:translateY(-1px); }
  input[type=range] { width:200px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; }
  .card-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; }
  #log { position:fixed; bottom:16px; right:16px; background:var(--card);
    border:1px solid var(--border); border-radius:10px; padding:10px 14px;
    font:12px ui-monospace,monospace; color:var(--muted); max-width:340px;
    max-height:180px; overflow:auto; display:none; box-shadow:0 8px 24px rgba(0,0,0,.12); }
  #log.show { display:block; }
</style>
</head>
<body>
<h1>GaugeChart · 精修版</h1>

<div class="toolbar">
  <button id="btn-theme">🌓 主题</button>
  <button id="btn-shape">◐ 形状</button>
  <button id="btn-rand">🎲 随机</button>
  <button id="btn-replay">▶ 重播</button>
  <button id="btn-log">📋 日志</button>
</div>

<div class="grid">
  <div class="card">
    <div class="card-label">3/4 圆 · 带阈值</div>
    <div id="c1"></div>
  </div>
  <div class="card">
    <div class="card-label">半圆</div>
    <div id="c2"></div>
  </div>
  <div class="card">
    <div class="card-label">全圆 · 闭环</div>
    <div id="c3"></div>
  </div>
  <div class="card">
    <div class="card-label">拖拽测试</div>
    <div id="c4"></div>
    <input type="range" id="slider" min="0" max="100" value="72" />
  </div>
</div>

<div id="log"></div>

<script type="module">
import GaugeChart from './kit/charts/gauge.js'

const logEl = document.getElementById('log')
function log(...a) {
  logEl.classList.add('show')
  logEl.textContent = `[${new Date().toLocaleTimeString()}] ${a.join(' ')}\n` + logEl.textContent
  if (logEl.textContent.length > 3000) logEl.textContent = logEl.textContent.slice(0, 3000)
}
document.getElementById('btn-log').onclick = () => logEl.classList.toggle('show')

const rand = (a, b) => Math.round(a + Math.random() * (b - a))

const c1 = new GaugeChart('#c1', {
  title: 'CPU 使用率',
  value: 72,
  min: 0, max: 100,
  valueLabel: 'CPU',
  unit: '%',
  sweepAngle: 270,
  startAngle: 135,
  thresholds: [
    { to: 60, color: '#10b981' },
    { to: 80, color: '#f59e0b' },
    { to: 100, color: '#ef4444' },
  ],
  height: 280,
  onHover: p => p && log('hover'),
})

const c2 = new GaugeChart('#c2', {
  title: '温度',
  value: 24.5,
  min: 0, max: 50,
  valueLabel: '℃',
  unit: '°',
  decimals: 1,
  sweepAngle: 180,
  startAngle: 180,
  innerRatio: 0.7,
  color: '#06b6d4',
  height: 220,
})

const c3 = new GaugeChart('#c3', {
  title: '完成度',
  value: 88,
  min: 0, max: 100,
  unit: '%',
  sweepAngle: 360,
  startAngle: -90,
  innerRatio: 0.78,
  thresholds: [
    { to: 50, color: '#a855f7' },
    { to: 80, color: '#6366f1' },
    { to: 100, color: '#3b82f6' },
  ],
  height: 280,
})

const c4 = new GaugeChart('#c4', {
  value: 72,
  min: 0, max: 100,
  sweepAngle: 270,
  startAngle: 135,
  height: 220,
})

document.getElementById('slider').oninput = (e) => {
  c4.setValue(Number(e.target.value))
  log('拖拽 →', e.target.value)
}

let dark = false
const shapes = [
  { sweepAngle: 270, startAngle: 135 },
  { sweepAngle: 180, startAngle: 180 },
  { sweepAngle: 360, startAngle: -90 },
]
let shapeIdx = 0

document.getElementById('btn-theme').onclick = () => {
  dark = !dark
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : '')
  const t = dark ? 'dark' : 'light'
  ;[c1, c2, c3, c4].forEach(c => c.setOptions({ theme: t }))
  log('主题 →', t)
}

document.getElementById('btn-shape').onclick = () => {
  shapeIdx = (shapeIdx + 1) % shapes.length
  const s = shapes[shapeIdx]
  c1.setOptions(s)
  log('形状 →', s.sweepAngle + '°')
}

document.getElementById('btn-rand').onclick = () => {
  c1.setValue(rand(10, 100))
  c2.setValue(rand(10, 45) + Math.random())
  c3.setValue(rand(10, 100))
  c4.setValue(rand(10, 100))
  document.getElementById('slider').value = c4._value
  log('已刷新')
}

document.getElementById('btn-replay').onclick = () => {
  ;[c1, c2, c3, c4].forEach(c => c.replay())
  log('重播动画')
}

window.addEventListener('error', e => log('ERR', e.message))
</script>
</body>
</html>
