<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>ViolinChart</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--border:#e2e8f0;--muted:#64748b}
[data-theme=dark]{--bg:#0a0e17;--card:#0f172a;--text:#e2e8f0;--border:#1e293b;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui;padding:24px;transition:background .2s,color .2s}
h1{font-size:20px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
button{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px;transition:all .15s}
button:hover{border-color:#3b82f6;color:#60a5fa;transform:translateY(-1px)}
.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.card-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
#log{position:fixed;bottom:16px;right:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font:12px ui-monospace,monospace;color:var(--muted);max-width:340px;max-height:180px;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
#log.show{display:block}
</style></head><body>
<h1>ViolinChart · 小提琴图</h1>
<div class="toolbar">
<button id="btn-theme">🌓 主题</button>
<button id="btn-dir">🔁 方向</button>
<button id="btn-mean">📊 均值</button>
<button id="btn-jitter">⚬ 抖动</button>
<button id="btn-rand">🎲 随机</button>
<button id="btn-replay">▶ 重播</button>
<button id="btn-log">📋 日志</button>
</div>
<div class="grid">
<div class="card"><div class="card-label">班级成绩分布 · 垂直</div><div id="c1"></div></div>
<div class="card"><div class="card-label">产品评分 · 水平</div><div id="c2"></div></div>
</div>
<div id="log"></div>
<script type="module">
import ViolinChart from './kit/charts/violin.js'
const logEl = document.getElementById('log')
function log(...a){logEl.classList.add('show');logEl.textContent=`[${new Date().toLocaleTimeString()}] ${a.join(' ')}\n`+logEl.textContent;if(logEl.textContent.length>3000)logEl.textContent=logEl.textContent.slice(0,3000)}
document.getElementById('btn-log').onclick=()=>logEl.classList.toggle('show')
function randn(mean, sd) {
  let u = 0, v = 0
  while (u === 0) u = Math.random()
  while (v === 0) v = Math.random()
  return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v)
}
// 双峰分布，展示小提琴图的优势
function bimodal(center, spread) {
  const pick = Math.random() > 0.5 ? center - spread : center + spread
  return pick + randn(0, spread * 0.4)
}
function mkClasses() {
  return [
    { label: '一班', values: Array.from({length: 60}, () => randn(78, 8)) },
    { label: '二班', values: Array.from({length: 60}, () => bimodal(72, 12)) },
    { label: '三班', values: Array.from({length: 60}, () => randn(85, 6)) },
    { label: '四班', values: Array.from({length: 60}, () => bimodal(65, 15)) },
  ]
}
function mkRatings() {
  return [
    { label: '产品 A', values: Array.from({length: 50}, () => 3 + randn(1, 0.6)).map(v=>Math.max(1, Math.min(5, v))) },
    { label: '产品 B', values: Array.from({length: 50}, () => bimodal(3, 1.3)).map(v=>Math.max(1, Math.min(5, v))) },
    { label: '产品 C', values: Array.from({length: 50}, () => 4 + randn(0.8, 0.5)).map(v=>Math.max(1, Math.min(5, v))) },
    { label: '产品 D', values: Array.from({length: 50}, () => 4.5 + randn(0, 0.4)).map(v=>Math.max(1, Math.min(5, v))) },
  ]
}
const c1 = new ViolinChart('#c1',{
  title:'班级成绩分布',
  subtitle:'KDE 核密度估计 · 内部箱线',
  groups: mkClasses(),
  height:420,
  yFormat: v => v.toFixed(0),
  showMean: true,
  onHover: p => p && log('hover', p.group.label, '中位', p.stats.med.toFixed(1)),
  onViolinClick: (g,i) => log('click', g.label, g.values.length+'个样本'),
})
const c2 = new ViolinChart('#c2',{
  title:'产品评分',
  direction:'horizontal',
  groups: mkRatings(),
  height:380,
  yFormat: v => v.toFixed(1),
  showJitter: true,
  jitterRadius: 1.5,
  fillOpacity: 0.45,
})
let dark=false
document.getElementById('btn-theme').onclick=()=>{dark=!dark;document.documentElement.setAttribute('data-theme',dark?'dark':'');const t=dark?'dark':'light';[c1,c2].forEach(c=>c.setOptions({theme:t}));log('主题 →',t)}
document.getElementById('btn-dir').onclick=()=>{const d=c1.opts.direction==='vertical'?'horizontal':'vertical';c1.setOptions({direction:d});log('方向 →',d)}
document.getElementById('btn-mean').onclick=()=>{const v=!c1.opts.showMean;c1.setOptions({showMean:v});c2.setOptions({showMean:v});log('均值 →',v)}
document.getElementById('btn-jitter').onclick=()=>{const v=!c2.opts.showJitter;c1.setOptions({showJitter:v});c2.setOptions({showJitter:v});log('抖动 →',v)}
document.getElementById('btn-rand').onclick=()=>{c1.setData({groups:mkClasses()});c2.setData({groups:mkRatings()});log('已刷新')}
document.getElementById('btn-replay').onclick=()=>{[c1,c2].forEach(c=>c.replay());log('重播')}
window.addEventListener('error',e=>log('ERR',e.message))
</script></body></html>
