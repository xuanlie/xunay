<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>声音测试</title>
<style>
  body { background: #111; color: #eee; font-family: sans-serif;
    padding: 40px 20px; text-align: center; }
  button { padding: 20px 40px; font-size: 20px; margin: 10px;
    background: #66ccff; color: #000; border: 0; border-radius: 12px;
    cursor: pointer; }
  #log { margin-top: 30px; padding: 16px; background: #000;
    color: #0f0; font-family: monospace; font-size: 13px;
    border-radius: 8px; text-align: left; white-space: pre-wrap;
    min-height: 100px; }
</style>
</head>
<body>
<h2>声音测试</h2>
<p style="color:#888">点下面按钮，应该听到"嘀"一声</p>

<button id="b1">440 Hz (A4)</button>
<button id="b2">523 Hz (C5)</button>
<button id="b3">和弦 C-E-G</button>

<div id="log">等待点击…</div>

<script>
const log = (msg) => {
  document.getElementById('log').textContent += '\n' + msg
  console.log(msg)
}

let ctx = null

document.getElementById('b1').addEventListener('click', async () => {
  try {
    log('--- 点按钮 1 ---')
    if (!ctx) { ctx = new AudioContext(); log('创建 AudioContext') }
    log('state=' + ctx.state)
    await ctx.resume()
    log('resume 后 state=' + ctx.state)
    const osc = ctx.createOscillator()
    const gain = ctx.createGain()
    osc.frequency.value = 440
    gain.gain.value = 0.5
    osc.connect(gain)
    gain.connect(ctx.destination)
    osc.start()
    osc.stop(ctx.currentTime + 0.5)
    log('✅ 播放 440Hz 0.5秒')
    log('samplerate=' + ctx.sampleRate)
    log('destination=' + (ctx.destination ? 'ok' : 'null'))
  } catch (e) {
    log('❌ ' + e.message)
  }
})

document.getElementById('b2').addEventListener('click', async () => {
  try {
    if (!ctx) { ctx = new AudioContext() }
    await ctx.resume()
    const osc = ctx.createOscillator()
    const gain = ctx.createGain()
    osc.frequency.value = 523
    gain.gain.value = 0.5
    osc.connect(gain)
    gain.connect(ctx.destination)
    osc.start()
    osc.stop(ctx.currentTime + 0.5)
    log('✅ 播放 523Hz')
  } catch (e) { log('❌ ' + e.message) }
})

document.getElementById('b3').addEventListener('click', async () => {
  try {
    if (!ctx) { ctx = new AudioContext() }
    await ctx.resume()
    for (const f of [261.63, 329.63, 392.00]) {
      const osc = ctx.createOscillator()
      const gain = ctx.createGain()
      osc.frequency.value = f
      gain.gain.value = 0.3
      osc.connect(gain)
      gain.connect(ctx.destination)
      osc.start()
      osc.stop(ctx.currentTime + 1.0)
    }
    log('✅ 播放 C 和弦')
  } catch (e) { log('❌ ' + e.message) }
})

// 页面加载时报告环境
log('浏览器: ' + navigator.userAgent.slice(0, 60))
log('AudioContext 支持: ' + (typeof AudioContext !== 'undefined'))
log('webkitAudioContext: ' + (typeof webkitAudioContext !== 'undefined'))
</script>
</body>
</html>
