<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MarimekkoChart</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--border:#e2e8f0;--muted:#64748b}
[data-theme=dark]{--bg:#0a0e17;--card:#0f172a;--text:#e2e8f0;--border:#1e293b;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui;padding:24px;transition:background .2s,color .2s}
h1{font-size:20px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
button{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px;transition:all .15s}
button:hover{border-color:#3b82f6;color:#60a5fa;transform:translateY(-1px)}
.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.card-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
#log{position:fixed;bottom:16px;right:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font:12px ui-monospace,monospace;color:var(--muted);max-width:340px;max-height:180px;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
#log.show{display:block}
</style></head><body>
<h1>MarimekkoChart · 马赛克图</h1>
<div class="toolbar">
<button id="btn-theme">🌓 主题</button>
<button id="btn-normalize">📊 归一化</button>
<button id="btn-color">🎨 配色</button>
<button id="btn-rand">🎲 随机</button>
<button id="btn-replay">▶ 重播</button>
<button id="btn-log">📋 日志</button>
</div>
<div class="grid">
<div class="card"><div class="card-label">各行业市场份额（宽=行业规模，高=品牌占比）</div><div id="c1"></div></div>
<div class="card"><div class="card-label">各国能源结构</div><div id="c2"></div></div>
</div>
<div id="log"></div>
<script type="module">
import MarimekkoChart from './kit/charts/marimekko.js'
const logEl = document.getElementById('log')
function log(...a){logEl.classList.add('show');logEl.textContent=`[${new Date().toLocaleTimeString()}] ${a.join(' ')}\n`+logEl.textContent;if(logEl.textContent.length>3000)logEl.textContent=logEl.textContent.slice(0,3000)}
document.getElementById('btn-log').onclick=()=>logEl.classList.toggle('show')
const rand=(a,b)=>a+Math.random()*(b-a)
const BRANDS = ['品牌A','品牌B','品牌C','品牌D','品牌E']
function mkMarket() {
  return [
    { label: '手机', values: { 品牌A: rand(200,400), 品牌B: rand(150,350), 品牌C: rand(100,250), 品牌D: rand(50,150), 品牌E: rand(30,100) } },
    { label: '电脑', values: { 品牌A: rand(300,500), 品牌B: rand(100,200), 品牌C: rand(80,180), 品牌D: rand(40,120), 品牌E: rand(20,80) } },
    { label: '平板', values: { 品牌A: rand(200,350), 品牌B: rand(120,220), 品牌C: rand(60,150), 品牌D: rand(30,90), 品牌E: rand(10,60) } },
    { label: '电视', values: { 品牌A: rand(150,280), 品牌B: rand(180,300), 品牌C: rand(80,180), 品牌D: rand(50,140), 品牌E: rand(40,110) } },
    { label: '耳机', values: { 品牌A: rand(100,200), 品牌B: rand(120,240), 品牌C: rand(150,280), 品牌D: rand(80,160), 品牌E: rand(50,130) } },
  ]
}
const SOURCES = ['煤炭','天然气','水电','核电','风电','光伏']
function mkEnergy() {
  return [
    { label: '中国', values: { 煤炭: 57, 天然气: 8, 水电: 13, 核电: 5, 风电: 9, 光伏: 8 } },
    { label: '美国', values: { 煤炭: 19, 天然气: 40, 水电: 6, 核电: 19, 风电: 9, 光伏: 7 } },
    { label: '德国', values: { 煤炭: 24, 天然气: 15, 水电: 4, 核电: 6, 风电: 27, 光伏: 24 } },
    { label: '法国', values: { 煤炭: 2, 天然气: 7, 水电: 11, 核电: 65, 风电: 9, 光伏: 6 } },
    { label: '日本', values: { 煤炭: 31, 天然气: 34, 水电: 8, 核电: 5, 风电: 3, 光伏: 19 } },
  ]
}
const c1 = new MarimekkoChart('#c1',{
  title:'各行业品牌份额',
  subtitle:'宽度=行业规模 · 高度=品牌内占比',
  data: { columns: mkMarket(), categories: BRANDS },
  height:460,
  normalize:true,
  onHover: p => p && log('hover', p.column.label, p.category, (p.ratio*100).toFixed(1)+'%'),
  onCellClick: (info) => log('click', info.column.label, info.category, info.value.toFixed(1)),
})
const c2 = new MarimekkoChart('#c2',{
  title:'各国能源结构',
  data: { columns: mkEnergy(), categories: SOURCES },
  height:420,
  normalize:true,
  colors:['#1e293b','#f59e0b','#3b82f6','#ef4444','#06b6d4','#eab308'],
})
let dark=false
document.getElementById('btn-theme').onclick=()=>{dark=!dark;document.documentElement.setAttribute('data-theme',dark?'dark':'');const t=dark?'dark':'light';[c1,c2].forEach(c=>c.setOptions({theme:t}));log('主题 →',t)}
document.getElementById('btn-normalize').onclick=()=>{const v=!c1.opts.normalize;c1.setOptions({normalize:v});c2.setOptions({normalize:v});log('归一化 →',v)}
let modes=['byCategory','byColumn'], ci=0
document.getElementById('btn-color').onclick=()=>{ci=(ci+1)%modes.length;const m=modes[ci];c1.setOptions({colorMode:m});log('配色 →',m)}
document.getElementById('btn-rand').onclick=()=>{c1.setData({columns:mkMarket(), categories:BRANDS});c2.setData({columns:mkEnergy(), categories:SOURCES});log('已刷新')}
document.getElementById('btn-replay').onclick=()=>{[c1,c2].forEach(c=>c.replay());log('重播')}
window.addEventListener('error',e=>log('ERR',e.message))
</script></body></html>
