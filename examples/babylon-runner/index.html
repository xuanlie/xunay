<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050508">
<title>XuNay × Babylon · 跑酷</title>
<link rel="preconnect" href="https://cdn.babylonjs.com" crossorigin>
<link rel="preload" href="https://cdn.babylonjs.com/babylon.js" as="script" crossorigin>
<link rel="stylesheet" href="../../core/src/ui.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100dvh; overflow: hidden; background: #050508; color: #e8e8f0;
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-touch-callout: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #hud {
    position: absolute; inset: 0; pointer-events: none; z-index: 10;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto; gap: 12px;
  }
  #hud > * { pointer-events: auto; }
  #hud-top { grid-column: 1; grid-row: 1; }
  #hud-title { grid-column: 2; grid-row: 1; align-self: start; }
  #hud-btns { grid-column: 2; grid-row: 3; align-self: end; display: flex; flex-direction: column; gap: 8px; }
  #hud .card { background: rgba(14,14,22,.85); border-color: rgba(68,68,85,.5); backdrop-filter: blur(12px); }
  #hud .card-title, #hud .card-header { color: #e8e8f0; }
  #hud .text-dim { color: #888 !important; }
  #hud .btn { background: rgba(26,26,36,.9); color: #e8e8f0; border-color: rgba(68,68,85,.6); }

  /* 触摸控制提示 */
  #tap-hint {
    position: absolute; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); left: 50%;
    transform: translateX(-50%);
    font-size: 12px; color: #666;
    background: rgba(14,14,22,.7); padding: 8px 16px; border-radius: 20px;
    backdrop-filter: blur(8px);
    pointer-events: none;
    transition: opacity .3s;
  }
  #tap-hint.hide { opacity: 0; }

  #loading {
    position: absolute; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: #050508; flex-direction: column; gap: 20px;
    transition: opacity .4s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading .bar { width: 240px; height: 6px; border-radius: 3px; background: rgba(68,68,85,.4); overflow: hidden; }
  #loading .bar > div { height: 100%; background: linear-gradient(90deg, #66ccff, #66ffcc); transition: width .2s; }
  #loading .text { font-size: 12px; color: #666; letter-spacing: 1px; }

  #end {
    position: absolute; inset: 0; z-index: 90;
    background: rgba(5,5,8,.85); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
  }
  #end.show { display: flex; }

  @media (max-width: 768px) {
    #hud { padding: 10px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
    #hud .card { padding: 8px 12px; }
    #hud-top [class*="text-xl"] { font-size: 18px !important; }
    #hud .btn { min-height: 44px; font-size: 14px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="loading">
  <div style="font-size: 16px; color: #66ccff; letter-spacing: 2px">XUNAY · RUNNER</div>
  <div class="bar"><div id="loading-bar" style="width: 0%"></div></div>
  <div class="text" id="loading-text">加载中 0%</div>
</div>

<div id="hud">
  <div id="hud-top"></div>
  <div id="hud-title"></div>
  <div id="hud-btns"></div>
</div>
<div id="tap-hint">← → 或 滑动 切换跑道</div>

<div id="end"></div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
<script type="module" src="./dist/bundle.js?v=1791115070"></script>
</body>
</html>
