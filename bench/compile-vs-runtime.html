<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>XuNay 编译期 vs 运行时 Benchmark</title>
<style>
  body { font-family: ui-monospace, Menlo, Consolas, monospace; padding: 24px; background: #0d1117; color: #c9d1d9; }
  h1 { color: #58a6ff; font-size: 20px; margin-bottom: 16px; }
  h2 { color: #79c0ff; font-size: 15px; margin-top: 28px; margin-bottom: 8px; }
  table { border-collapse: collapse; margin-bottom: 16px; }
  th, td { padding: 6px 14px; text-align: left; border-bottom: 1px solid #30363d; font-size: 13px; }
  th { color: #8b949e; font-weight: 600; }
  .good { color: #3fb950; }
  .bad  { color: #f85149; }
  .neut { color: #d29922; }
  .num  { text-align: right; font-variant-numeric: tabular-nums; }
  #out   { max-width: 900px; }
  #phase { color: #8b949e; margin-bottom: 8px; }
</style>
</head>
<body>
<h1>XuNay — 编译期 vs 运行时</h1>
<div id="phase">初始化…</div>
<div id="out"></div>

<script type="module">
import { signal, effect, render, tags } from '../core/dist/xunay.esm.js'
const div = tags.div, span = tags.span

const out = document.getElementById('out')
const phase = document.getElementById('phase')

function log(html) {
  const d = document.createElement('div')
  d.innerHTML = html
  out.appendChild(d)
}

function timeMedian(fn, iters) {
  for (let i = 0; i < 3; i++) fn()
  const t = []
  for (let i = 0; i < iters; i++) {
    const t0 = performance.now()
    fn()
    t.push(performance.now() - t0)
  }
  t.sort((a, b) => a - b)
  return t[Math.floor(t.length / 2)]
}

// ============================================================
// 场景 1：首挂 1000 个静态节点
// ============================================================
function staticCompiled() {
  const root = document.createElement('div')
  for (let i = 0; i < 1000; i++) {
    const d = document.createElement('div')
    d.className = 'item'
    const s = document.createElement('span')
    const t = document.createTextNode(String(i))
    s.appendChild(t)
    d.appendChild(s)
    root.appendChild(d)
  }
  return root
}

function staticRuntime() {
  const items = []
  for (let i = 0; i < 1000; i++) {
    items.push(div({ class: 'item' }, span(null, String(i))))
  }
  return render(div(null, ...items))
}

// ============================================================
// 场景 2：首挂 1000 个动态节点（每个带 effect）
// ============================================================
function dynamicCompiled() {
  const root = document.createElement('div')
  const sigs = []
  for (let i = 0; i < 1000; i++) {
    const sig = signal(i)
    sigs.push(sig)
    const d = document.createElement('div')
    d.className = 'item'
    const s = document.createElement('span')
    const t = document.createElement('span')
    t.style.display = 'contents'
    effect(() => { t.textContent = String(sig()) })
    s.appendChild(t)
    d.appendChild(s)
    root.appendChild(d)
  }
  return { root, sigs }
}

function dynamicRuntime() {
  const sigs = []
  const items = []
  for (let i = 0; i < 1000; i++) {
    const sig = signal(i)
    sigs.push(sig)
    items.push(div({ class: 'item' }, span(null, () => String(sig()))))
  }
  const root = render(div(null, ...items))
  return { root, sigs }
}

// ============================================================
// 场景 3：更新一个 signal 的延迟
// ============================================================
function updateTest(sigs) {
  const t0 = performance.now()
  for (let i = 0; i < 10000; i++) sigs[500](i)
  return (performance.now() - t0) / 10000 * 1000  // µs/op
}

// ============================================================
// 场景 4：list() keyed 复用（运行时 API，只测运行时）
// ============================================================
function listTest() {
  const arr = signal(Array.from({ length: 1000 }, (_, i) => ({ id: i, v: i })))
  const items = arr().map(x => div({ class: 'item' }, span(null, () => String(x.v))))
  const root = render(div(null, ...items))
  const t0 = performance.now()
  arr(arr().map(x => ({ ...x, v: x.v + 1 })))
  return performance.now() - t0
}

// ============================================================
// 跑
// ============================================================
async function run() {
  phase.textContent = '场景 1：首挂 1000 静态节点…'
  await new Promise(r => setTimeout(r, 50))

  const t1c = timeMedian(staticCompiled, 10)
  const t1r = timeMedian(staticRuntime, 10)
  log(`<h2>场景 1 · 首挂 1000 个静态节点</h2>
<table>
<tr><th>方式</th><th class="num">中位耗时</th><th>备注</th></tr>
<tr><td>编译期（createElement）</td><td class="num good">${t1c.toFixed(2)} ms</td><td>—</td></tr>
<tr><td>运行时（vnode → render）</td><td class="num">${t1r.toFixed(2)} ms</td><td>含 vnode 对象创建</td></tr>
<tr><td>比值</td><td class="num neut">${(t1r / t1c).toFixed(2)}×</td><td>运行时是编译期的多少倍</td></tr>
</table>`)

  phase.textContent = '场景 2：首挂 1000 个动态节点（每个带 effect）…'
  await new Promise(r => setTimeout(r, 50))

  const t2c = timeMedian(dynamicCompiled, 5)
  const t2r = timeMedian(dynamicRuntime, 5)
  log(`<h2>场景 2 · 首挂 1000 个动态节点（每个带 effect）</h2>
<table>
<tr><th>方式</th><th class="num">中位耗时</th><th>备注</th></tr>
<tr><td>编译期</td><td class="num good">${t2c.toFixed(2)} ms</td><td>1000 个 signal + effect</td></tr>
<tr><td>运行时</td><td class="num">${t2r.toFixed(2)} ms</td><td>1000 个 vnode + signal + effect</td></tr>
<tr><td>比值</td><td class="num neut">${(t2r / t2c).toFixed(2)}×</td><td>—</td></tr>
</table>`)

  phase.textContent = '场景 3：更新一个 signal…'
  await new Promise(r => setTimeout(r, 50))

  const c = dynamicCompiled()
  const r = dynamicRuntime()
  const t3c = timeMedian(() => updateTest(c.sigs), 100)
  const t3r = timeMedian(() => updateTest(r.sigs), 100)
  log(`<h2>场景 3 · 改 1 个 signal（1000 节点里只有 1 个订阅它）</h2>
<table>
<tr><th>方式</th><th class="num">中位耗时</th><th>备注</th></tr>
<tr><td>编译期</td><td class="num good">${(t3c * 1000).toFixed(2)} µs</td><td>—</td></tr>
<tr><td>运行时</td><td class="num">${(t3r * 1000).toFixed(2)} µs</td><td>—</td></tr>
<tr><td>比值</td><td class="num neut">${(t3r / t3c).toFixed(2)}×</td><td>—</td></tr>
</table>
<p style="color:#8b949e;font-size:12px">注：两者理论上应该一样——更新走 effect，不走 vnode。</p>`)

  phase.textContent = '场景 4：list() keyed 复用…'
  await new Promise(r => setTimeout(r, 50))

  const t4 = timeMedian(listTest, 10)
  log(`<h2>场景 4 · list() 1000 项 keyed 更新</h2>
<table>
<tr><th>方式</th><th class="num">中位耗时</th></tr>
<tr><td>运行时 list()</td><td class="num">${t4.toFixed(2)} ms</td></tr>
</table>
<p style="color:#8b949e;font-size:12px">注：list() 是运行时 API，编译期版本暂未实现等价物。</p>`)

  phase.textContent = '完成。'
}

run().catch(e => {
  phase.innerHTML = '<span class="bad">出错：' + e.message + '</span>'
  console.error(e)
})
</script>
</body>
</html>
