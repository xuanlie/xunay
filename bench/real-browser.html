<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>XuNay 真实浏览器基准</title>
<style>
  body { font-family: monospace; padding: 20px; background: #0d1117; color: #c9d1d9; }
  pre { background: #161b22; padding: 16px; border-radius: 8px; line-height: 1.6; }
  .good { color: #3fb950; } .bad { color: #f85149; }
  iframe { width: 1px; height: 1px; opacity: 0; position: absolute; }
</style>
</head>
<body>
<h1>⚡ XuNay 真实浏览器性能测试</h1>
<pre id="out">初始化中...</pre>

<script>
const out = document.getElementById('out');
const log = (m, cls) => { 
  const line = cls ? `<span class="${cls}">${m}</span>` : m;
  out.innerHTML += line + '\n';
};

function stats(arr) {
  const s = [...arr].sort((a, b) => a - b);
  const lo = Math.floor(s.length * 0.1), hi = Math.ceil(s.length * 0.9);
  const t = s.slice(lo, hi);
  return {
    median: s[Math.floor(s.length / 2)],
    avg: t.reduce((a, b) => a + b, 0) / t.length,
    min: s[0], max: s[s.length - 1],
  };
}

async function measure(fn, warmup = 5, rounds = 30) {
  for (let r = 0; r < warmup; r++) {
    document.body.querySelector('#stage').innerHTML = '';
    fn();
    await new Promise(res => requestAnimationFrame(res));
  }
  const results = [];
  for (let r = 0; r < rounds; r++) {
    document.body.querySelector('#stage').innerHTML = '';
    await new Promise(res => requestAnimationFrame(res));
    const t0 = performance.now();
    fn();
    await new Promise(res => requestAnimationFrame(res));
    results.push(performance.now() - t0);
    await new Promise(res => requestAnimationFrame(res));
  }
  return stats(results);
}

// 循环建
function loopBuild(n) {
  const ul = document.createElement('ul');
  for (let i = 0; i < n; i++) {
    const li = document.createElement('li');
    li.appendChild(document.createTextNode('Item ' + i));
    ul.appendChild(li);
  }
  document.querySelector('#stage').appendChild(ul);
}

// 分 10 段建
function splitBuild(n, parts = 10) {
  const ul = document.createElement('ul');
  const per = n / parts;
  for (let p = 0; p < parts; p++) {
    for (let i = 0; i < per; i++) {
      const li = document.createElement('li');
      li.appendChild(document.createTextNode('Item ' + (p * per + i)));
      ul.appendChild(li);
    }
  }
  document.querySelector('#stage').appendChild(ul);
}

// Template + cloneNode（最接近工业级）
function templateBuild(n) {
  const tpl = document.createElement('template');
  tpl.innerHTML = '<ul></ul>';
  const ul = tpl.content.firstChild.cloneNode();
  const liTpl = document.createElement('template');
  liTpl.innerHTML = '<li></li>';
  for (let i = 0; i < n; i++) {
    const li = liTpl.content.firstChild.cloneNode();
    li.textContent = 'Item ' + i;
    ul.appendChild(li);
  }
  document.querySelector('#stage').appendChild(ul);
}

async function run() {
  out.innerHTML = '';
  log('=== 真实浏览器 DOM 性能 ===');
  log('UA: ' + navigator.userAgent.split(' ').slice(-2).join(' '));
  log('');

  for (const n of [100, 1000, 5000]) {
    log(`--- ${n} 项 ---`);
    const l = await measure(() => loopBuild(n));
    const s = await measure(() => splitBuild(n));
    const t = await measure(() => templateBuild(n));
    log(`  循环建    | 中位 ${l.median.toFixed(1).padStart(7)} | 平均 ${l.avg.toFixed(1).padStart(7)} | 范围 ${l.min.toFixed(0)}~${l.max.toFixed(0)} ms`);
    log(`  分段建    | 中位 ${s.median.toFixed(1).padStart(7)} | 平均 ${s.avg.toFixed(1).padStart(7)} | 范围 ${s.min.toFixed(0)}~${s.max.toFixed(0)} ms`);
    log(`  Template  | 中位 ${t.median.toFixed(1).padStart(7)} | 平均 ${t.avg.toFixed(1).padStart(7)} | 范围 ${t.min.toFixed(0)}~${t.max.toFixed(0)} ms`);
    log('');
  }
  log('✅ 完成');
}

// 先加一个隐藏的 stage
document.body.insertAdjacentHTML('beforeend', '<div id="stage" style="display:none"></div>');
run();
</script>
</body>
</html>
