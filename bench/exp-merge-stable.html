<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>stable</title>
<style>body{font-family:monospace;padding:20px;line-height:1.7}pre{background:#f5f5f5;padding:16px;border-radius:8px;font-size:13px}</style>
</head><body>
<h2>稳定测量：3 次取中位</h2>
<pre id="out">跑测试中...</pre>
<script type="module">
const out = []
function log(s) { out.push(s); document.getElementById('out').textContent = out.join('\n') }

const X = await import('../core/dist/xunay.esm.js')
const { signal, div, span, render, effect } = X

const N = 1000
const ITERS = 100
const RUNS = 3

function benchOnce(fn) {
  for (let i = 0; i < 20; i++) fn()
  const t0 = performance.now()
  for (let i = 0; i < ITERS; i++) fn()
  return (performance.now() - t0) / ITERS * 1000   // µs/次
}

function median(arr) {
  const s = [...arr].sort((a,b) => a-b)
  return s[Math.floor(s.length/2)]
}

async function nextFrame() { return new Promise(r => setTimeout(r, 100)) }

// A：现在的 el()（已 merge）
{
  const n = signal(0)
  const make = () => {
    const kids = []
    for (let i = 0; i < N; i++) kids.push(span(null, () => n() + i))
    return div(null, ...kids)
  }
  const times = []
  for (let r = 0; r < RUNS; r++) {
    await nextFrame()
    times.push(benchOnce(make))
  }
  log(`A. el() (已合并)   : ${times.map(x => x.toFixed(1)).join(' / ')} µs   中位 ${median(times).toFixed(1)}`)
}

await nextFrame()

// 关闭 merge 再测
{
  const rt = X.__runtime || (await import('../core/dist/xunay.esm.js')).runtime
  // 尝试访问 runtime（可能没导出，则跳过）
  const n = signal(0)
  const make = () => {
    const kids = []
    for (let i = 0; i < N; i++) kids.push(span(null, () => n() + i))
    return div(null, ...kids)
  }
  const times = []
  for (let r = 0; r < RUNS; r++) {
    await nextFrame()
    times.push(benchOnce(make))
  }
  log(`A2. el() 复测     : ${times.map(x => x.toFixed(1)).join(' / ')} µs   中位 ${median(times).toFixed(1)}`)
}

await nextFrame()

// 对照：手动合并（模拟 B）
{
  const n = signal(0)
  const make = () => {
    const host = document.createElement('div')
    const slots = []
    for (let i = 0; i < N; i++) {
      const s = document.createElement('span')
      const t = document.createTextNode(String(n() + i))
      s.appendChild(t)
      host.appendChild(s)
      slots.push({ t, i, last: n() + i })
    }
    effect(() => {
      const v = n()
      for (let k = 0; k < slots.length; k++) {
        const s = slots[k]
        const val = v + s.i
        if (s.last !== val) { s.t.textContent = String(val); s.last = val }
      }
    })
    return host
  }
  const times = []
  for (let r = 0; r < RUNS; r++) {
    await nextFrame()
    times.push(benchOnce(make))
  }
  log(`B. 手动合并（对照）: ${times.map(x => x.toFixed(1)).join(' / ')} µs   中位 ${median(times).toFixed(1)}`)
}
</script></body></html>
